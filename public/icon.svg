<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tetrisGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="tetrisGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="tetrisGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- Blueprint grid lines -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.4">
    <line x1="120" y1="80" x2="120" y2="432" />
    <line x1="200" y1="80" x2="200" y2="432" />
    <line x1="280" y1="80" x2="280" y2="432" />
    <line x1="360" y1="80" x2="360" y2="432" />
    <line x1="80" y1="120" x2="432" y2="120" />
    <line x1="80" y1="200" x2="432" y2="200" />
    <line x1="80" y1="280" x2="432" y2="280" />
    <line x1="80" y1="360" x2="432" y2="360" />
  </g>

  <!-- Tetris Blocks (Bed, Desk, Wardrobe in harmony) -->
  <g filter="url(#glow)">
    <!-- Bed block (Blue) -->
    <rect x="250" y="130" width="140" height="200" rx="16" fill="url(#tetrisGrad2)" stroke="#60a5fa" stroke-width="4"/>
    <rect x="270" y="145" width="100" height="36" rx="8" fill="#ffffff" opacity="0.4"/>
    
    <!-- Desk block (Emerald) -->
    <rect x="120" y="130" width="110" height="75" rx="12" fill="url(#tetrisGrad1)" stroke="#34d399" stroke-width="4"/>
    
    <!-- Wardrobe block (Purple) -->
    <rect x="120" y="230" width="110" height="150" rx="14" fill="url(#tetrisGrad3)" stroke="#a78bfa" stroke-width="4"/>
  </g>

  <!-- Dimension line & Arrow (mm symbol) -->
  <path d="M120 410 L390 410" stroke="#10b981" stroke-width="4" stroke-dasharray="6 4"/>
  <circle cx="120" cy="410" r="5" fill="#10b981"/>
  <circle cx="390" cy="410" r="5" fill="#10b981"/>
</svg>
